[workspace]
resolver = "3"
members = ["abi", "kernel-core", "kernel", "libsys", "boot-uefi", "roottest"]
# Host-buildable crates; `kernel` and `boot-uefi` build only for their targets.
default-members = ["abi", "kernel-core", "libsys"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("silica"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
