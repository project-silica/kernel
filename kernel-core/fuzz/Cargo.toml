[package]
name = "kernel-core-fuzz"
description = "Coverage-guided fuzz targets for kernel-core (run by tools/fuzz.sh)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kernel-core = { path = ".." }
silica-abi = { path = "../../abi" }
silica-formats = { path = "../../formats" }

[[bin]]
name = "syscalls"
path = "fuzz_targets/syscalls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "elf"
path = "fuzz_targets/elf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "acpi"
path = "fuzz_targets/acpi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ramdisk"
path = "fuzz_targets/ramdisk.rs"
test = false
doc = false
bench = false

# Not part of the kernel workspace: cargo-fuzz builds it on its own.
[workspace]

[profile.release]
debug = 1
