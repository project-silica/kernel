[workspace]
resolver = "3"
members = ["abi", "kernel-core", "kernel", "libsys", "boot-uefi", "roottest"]
# Host-buildable crates; `kernel` and `boot-uefi` build only for their targets.
default-members = ["abi", "kernel-core", "libsys"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("silica"))', 'cfg(loom)'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Line tables for the symbolizer; the image carries stripped copies.
debug = "line-tables-only"
# Arithmetic that overflows stops the kernel instead of wrapping silently.
overflow-checks = true
# Speed first: at this level the kernel is about 60 KB of a 256 KB budget,
# and "s" cost 10% on the IPC path (rep movs for small copies, loops kept).
opt-level = 3
lto = true
codegen-units = 1
